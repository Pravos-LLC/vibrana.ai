name: Dependabot auto-merge

# Turns on GitHub's native auto-merge for Dependabot PRs that are safe patch or
# minor bumps. GitHub then merges automatically once every required check
# ("typecheck · lint · guardrail", "Vercel", "database", "e2e", "lighthouse",
# "security") reports green — this job never waits on or evaluates checks
# itself, and it never checks out or executes any PR code.
#
# `pull_request_target` (not `pull_request`) is required: GitHub forces a
# read-only GITHUB_TOKEN on `pull_request` runs triggered by dependabot[bot],
# so enabling auto-merge would fail. `pull_request_target` runs with the
# target repo's token permissions instead, scoped down below to the minimum
# needed (contents + pull-requests, both write, nothing else).

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: auto-merge
    if: github.repository == 'Pravos-LLC/vibrana.ai' && (github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Only patch and minor bumps qualify. This excludes every major bump,
      # including github-actions majors (e.g. actions/checkout v4 -> v7) —
      # those never match semver-patch/semver-minor and always need a human.
      - name: Enable auto-merge for patch/minor bumps
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
