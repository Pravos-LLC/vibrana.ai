name: Security

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1

defaults:
  run:
    shell: bash

jobs:
  security:
    if: github.repository == 'Pravos-LLC/vibrana.ai'
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" > checksum.txt
          sha256sum -c checksum.txt
          tar -xzf "$tarball" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Secret scan (complete fetched history, including root commits)
        run: |
          scan_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks-default.XXXXXX")"
          trap 'rm -rf "$scan_dir"' EXIT
          printf '[extend]\nuseDefault = true\n' > "$scan_dir/config.toml"
          gitleaks git --no-banner --redact --log-level error \
            --config "$scan_dir/config.toml" \
            --gitleaks-ignore-path "$scan_dir" --ignore-gitleaks-allow \
            --max-archive-depth 3 --log-opts='--all --full-history' .

      - uses: actions/setup-node@v7
        if: ${{ !cancelled() }}
        with:
          node-version: '24'

      - name: Dependency audit (production deps, high+)
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high
