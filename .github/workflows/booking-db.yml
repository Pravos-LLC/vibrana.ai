name: Booking database
on:
  pull_request:
    paths:
      - 'lib/booking/**'
      - 'app/api/booking/**'
      - 'supabase/migrations/*booking*'
      - 'tests/sql/booking*.sql'
      - 'scripts/test-booking-db.sh'
      - '.github/workflows/booking-db.yml'
concurrency:
  group: booking-db-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  booking-db:
    if: github.repository == 'Pravos-LLC/vibrana.ai'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/test-booking-db.sh
